<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Deer — Login</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-overlay"><section class="auth-panel"><div class="auth-content"><div class="auth-tabs"><a class="auth-tab active" href="login.html">Login</a><a class="auth-tab" href="signup.html">Sign Up</a></div><h1 class="auth-heading">Welcome Back</h1><p class="auth-sub">Log in to continue your magical learning journey.</p><form id="loginForm"><div class="form-group"><label>Email</label><div class="input-wrap"><span>✉</span><input id="loginEmail" type="email" placeholder="Enter your email" required autocomplete="email"></div></div><div class="form-group"><label>Password</label><div class="input-wrap"><span>🔒</span><input id="loginPassword" type="password" placeholder="Enter your password" required autocomplete="current-password"></div></div><div class="form-row"><label><input type="checkbox"> Remember me</label><a href="#" onclick="return false">Forgot password?</a></div><button class="btn-primary" id="loginBtn">Log In ✦</button><div class="msg" id="loginMsg"></div></form><div class="auth-foot">New to Little Deer? <a href="signup.html">Create an account</a></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const f=document.getElementById('loginForm'),m=document.getElementById('loginMsg'),b=document.getElementById('loginBtn');let busy=false;f.onsubmit=async e=>{e.preventDefault();m.className='msg';b.disabled=true;b.textContent='Logging in...';busy=true;try{await auth.signInWithEmailAndPassword(loginEmail.value.trim(),loginPassword.value);location.href='dashboard.html'}catch(err){m.textContent='The email or password is incorrect. Please try again.';m.className='msg show error';busy=false}finally{b.disabled=false;b.textContent='Log In ✦'}};auth.onAuthStateChanged(u=>{if(u&&!busy)location.href='dashboard.html'});</script></body></html>
