<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Little Deer — Sign Up</title><link rel="stylesheet" href="style.css"></head><body class="auth-page"><main class="auth-overlay"><section class="auth-panel"><div class="auth-content"><div class="auth-tabs"><a class="auth-tab" href="login.html">Login</a><a class="auth-tab active" href="signup.html">Sign Up</a></div><h1 class="auth-heading">Create Your Account</h1><p class="auth-sub">Join our magical learning community.</p><form id="signupForm"><div class="form-group"><label>Full Name</label><div class="input-wrap"><span>♙</span><input id="signupName" type="text" placeholder="Enter your full name" required></div></div><div class="form-group"><label>Email</label><div class="input-wrap"><span>✉</span><input id="signupEmail" type="email" placeholder="Enter your email" required></div></div><div class="form-group"><label>Password</label><div class="input-wrap"><span>🔒</span><input id="signupPassword" type="password" minlength="6" placeholder="Create a password" required></div></div><div class="form-group"><label>I am a</label><div class="role-selector"><label class="role-option"><input type="radio" name="role" value="teacher" checked><strong>🎓 Teacher</strong><small>Guide & Inspire</small></label><label class="role-option"><input type="radio" name="role" value="student"><strong>♙ Student</strong><small>Learn & Explore</small></label></div></div><button class="btn-primary" id="signupBtn">Create Account ✦</button><div class="msg" id="signupMsg"></div></form><div class="auth-foot">Already have an account? <a href="login.html">Log in</a></div></div></section></main><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script><script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script><script src="firebase-config.js"></script><script>const f=document.getElementById('signupForm'),m=document.getElementById('signupMsg'),b=document.getElementById('signupBtn');let busy=false,cred=null;f.onsubmit=async e=>{e.preventDefault();m.className='msg';b.disabled=true;b.textContent='Creating account...';busy=true;try{let name=signupName.value.trim(),email=signupEmail.value.trim(),password=signupPassword.value,role=document.querySelector('input[name=role]:checked').value;cred=await auth.createUserWithEmailAndPassword(email,password);await db.collection('users').doc(cred.user.uid).set({name,email,role,status:'pending',allowedBooks:[],studentCode:null,createdAt:firebase.firestore.FieldValue.serverTimestamp(),activatedAt:null,expiresAt:null});location.href='dashboard.html'}catch(err){let t='Something went wrong. Please try again.';if(err.code==='auth/email-already-in-use')t='This email is already registered.';if(err.code==='auth/weak-password')t='Password must contain at least 6 characters.';if(err.code==='auth/invalid-email')t='Please enter a valid email address.';if(cred&&cred.user){try{await cred.user.delete()}catch(e){try{await auth.signOut()}catch(x){}}}m.textContent=t;m.className='msg show error';busy=false}finally{b.disabled=false;b.textContent='Create Account ✦'}};auth.onAuthStateChanged(u=>{if(u&&!busy)location.href='dashboard.html'});</script></body></html>
