<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Little Deer — تسجيل الدخول</title>
<link rel="stylesheet" href="style.css">
</head>
<body>

<div class="card" id="card">
  <div class="brand"><span class="antler">🦌</span><h1>Little Deer</h1></div>
  <p class="subtitle" id="subtitle">سجّلي دخولك للمتابعة</p>

  <!-- Login form -->
  <form id="loginForm">
    <label>البريد الإلكتروني</label>
    <input type="email" id="loginEmail" required autocomplete="email">
    <label>كلمة المرور</label>
    <input type="password" id="loginPassword" required autocomplete="current-password">
    <button type="submit" class="primary" id="loginBtn">دخول</button>
    <div class="msg" id="loginMsg"></div>
  </form>

  <!-- Signup form -->
  <form id="signupForm" style="display:none">
    <label>الاسم</label>
    <input type="text" id="signupName" required>
    <label>البريد الإلكتروني</label>
    <input type="email" id="signupEmail" required autocomplete="email">
    <label>كلمة المرور (٦ حروف على الأقل)</label>
    <input type="password" id="signupPassword" required minlength="6" autocomplete="new-password">
    <label>نوع الحساب</label>
    <div class="role-toggle">
      <label><input type="radio" name="role" value="teacher" checked><span>معلّم/ة</span></label>
      <label><input type="radio" name="role" value="student"><span>طالب/ة</span></label>
    </div>
    <button type="submit" class="primary" id="signupBtn">إنشاء الحساب</button>
    <div class="msg" id="signupMsg"></div>
  </form>

  <div class="switch-link">
    <span id="toSignupWrap">مفيش حساب؟ <a id="toSignup">سجّلي دلوقتي</a></span>
    <span id="toLoginWrap" style="display:none">عندك حساب؟ <a id="toLogin">دخول</a></span>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore-compat.js"></script>
<script src="firebase-config.js"></script>
<script>
const loginForm = document.getElementById('loginForm');
const signupForm = document.getElementById('signupForm');
const subtitle = document.getElementById('subtitle');
const toSignup = document.getElementById('toSignup');
const toLogin = document.getElementById('toLogin');
const toSignupWrap = document.getElementById('toSignupWrap');
const toLoginWrap = document.getElementById('toLoginWrap');
const AFTER_LOGIN_PAGE = 'dashboard.html';

function showMsg(el, text, type){
  el.textContent = text;
  el.className = 'msg show ' + type;
}

toSignup.onclick = () => {
  loginForm.style.display='none'; signupForm.style.display='block';
  toSignupWrap.style.display='none'; toLoginWrap.style.display='block';
  subtitle.textContent = 'إنشاء حساب جديد';
};
toLogin.onclick = () => {
  signupForm.style.display='none'; loginForm.style.display='block';
  toLoginWrap.style.display='none'; toSignupWrap.style.display='block';
  subtitle.textContent = 'سجّلي دخولك للمتابعة';
};

// ---- Login ----
loginForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const msg = document.getElementById('loginMsg');
  msg.className = 'msg';
  btn.disabled = true; btn.textContent = 'جاري الدخول...';
  try{
    const email = document.getElementById('loginEmail').value.trim();
    const password = document.getElementById('loginPassword').value;
    await auth.signInWithEmailAndPassword(email, password);
    window.location.href = AFTER_LOGIN_PAGE;
  }catch(err){
    showMsg(msg, 'الإيميل أو كلمة المرور غلط، حاولي تاني', 'error');
  }finally{
    btn.disabled = false; btn.textContent = 'دخول';
  }
});

// ---- Signup ----
signupForm.addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('signupBtn');
  const msg = document.getElementById('signupMsg');
  msg.className = 'msg';
  btn.disabled = true; btn.textContent = 'جاري إنشاء الحساب...';
  try{
    const name = document.getElementById('signupName').value.trim();
    const email = document.getElementById('signupEmail').value.trim();
    const password = document.getElementById('signupPassword').value;
    const role = document.querySelector('input[name=role]:checked').value;

    const cred = await auth.createUserWithEmailAndPassword(email, password);

    await db.collection('users').doc(cred.user.uid).set({
      name: name,
      email: email,
      role: role,
      status: 'pending',       // pending -> active -> (rejected / suspended)
      allowedBooks: [],
      studentCode: null,
      createdAt: firebase.firestore.FieldValue.serverTimestamp(),
      activatedAt: null,
      expiresAt: null
    });

    // بعت إيميل تأكيد حقيقي من فايربيز
    await cred.user.sendEmailVerification();

    window.location.href = AFTER_LOGIN_PAGE;
  }catch(err){
    let text = 'حصل خطأ، حاولي تاني';
    if(err.code === 'auth/email-already-in-use') text = 'الإيميل ده مسجل قبل كده';
    if(err.code === 'auth/weak-password') text = 'كلمة المرور لازم تكون ٦ حروف على الأقل';
    if(err.code === 'auth/invalid-email') text = 'الإيميل مش صحيح';
    showMsg(msg, text, 'error');
  }finally{
    btn.disabled = false; btn.textContent = 'إنشاء الحساب';
  }
});

auth.onAuthStateChanged((user) => {
  if(user) window.location.href = AFTER_LOGIN_PAGE;
});
</script>
</body>
</html>
